<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Apprends l'histoire du Congo et de l'Afrique en jouant : cours courts, quiz, badges, annuaire des noms congolais et bibliothèque gratuite.">
<meta property="og:title" content="Sikuzani Académie : le défi de l'histoire du Congo">
<meta property="og:description" content="Tu crois connaître l'histoire du Congo ? Prouve-le. Cours, quiz et badges gratuits.">
<meta property="og:image" content="https://sikuzani.com/partage.jpg">
<meta property="og:url" content="https://sikuzani.com/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icone.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Sikuzani Académie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : application à vues (accueil, cours, quiz, annuaire, bibliothèque, profil) ; barre du haut + barre d'onglets en bas sur téléphone. */
:root{
  --paper:#EFE6D8; --paper-2:#E6DACA; --card:#F7F1E7;
  --ink:#3A2410; --ink-soft:#6E5338; --sepia:#7A4516;
  --gold:#B8862B; --gold-hi:#D9A93E; --line:#D3C2A8; --on-sepia:#F7F1E7;
  --ok:#3F7A3A; --ok-bg:#E3EEDB; --bad:#A83A26; --bad-bg:#F4DED6;
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1E160F; --paper-2:#261C13; --card:#2B2017; --ink:#F0E5D3; --ink-soft:#C4AD8F; --sepia:#D9A35E;
  --gold:#D9A93E; --gold-hi:#E8BE5A; --line:#4A3826; --on-sepia:#1E160F;
  --ok:#8CC97F; --ok-bg:#24331F; --bad:#E8907C; --bad-bg:#3A1F18; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1E160F; --paper-2:#261C13; --card:#2B2017; --ink:#F0E5D3; --ink-soft:#C4AD8F; --sepia:#D9A35E;
  --gold:#D9A93E; --gold-hi:#E8BE5A; --line:#4A3826; --on-sepia:#1E160F;
  --ok:#8CC97F; --ok-bg:#24331F; --bad:#E8907C; --bad-bg:#3A1F18; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--sepia)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;letter-spacing:.02em;margin:0}
h2{font-size:clamp(1.5rem,3vw,2.1rem)}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.lede{color:var(--ink-soft);max-width:62ch}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 .95rem var(--f-body);padding:10px 18px;border-radius:999px;border:1px solid var(--sepia);background:var(--sepia);color:var(--on-sepia);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--sepia)}
.btn:disabled{opacity:.45;cursor:default}
.btn:not(:disabled):hover{filter:brightness(1.08)}

/* Barre du haut */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand img{width:34px;height:40px;object-fit:cover;border-radius:3px}
.brand b{font-family:var(--f-display);letter-spacing:.18em;font-size:1rem}
.brand small{display:block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.links{display:flex;gap:4px}
.links a{text-decoration:none;color:var(--ink-soft);font-size:.92rem;padding:6px 12px;border-radius:999px}
.links a[aria-current="page"]{background:var(--paper-2);color:var(--sepia);font-weight:600}
.tools{display:flex;align-items:center;gap:10px}
.pts{font-family:var(--f-mono);font-size:.82rem;padding:6px 12px;border-radius:999px;border:1px solid var(--gold);color:var(--sepia);text-decoration:none;white-space:nowrap}
.pts b{font-variant-numeric:tabular-nums}
select.langsel{font:500 .8rem var(--f-mono);padding:7px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.tabbar{display:none}
@media (max-width:820px){
  .links{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar a{display:grid;justify-items:center;gap:2px;text-decoration:none;color:var(--ink-soft);font-size:.7rem;padding:4px 0}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:var(--sepia);font-weight:600}
  main{padding-bottom:84px}
}
main{padding-block:32px 64px}
.view{display:grid;gap:56px}

/* Accueil */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2rem,4.6vw,3.3rem);line-height:1.1;margin-block:12px 16px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero-logo{width:100%;max-width:330px;justify-self:center;mix-blend-mode:multiply}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero-logo{mix-blend-mode:normal;border-radius:12px}}
:root[data-theme="dark"] .hero-logo{mix-blend-mode:normal;border-radius:12px}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero-logo{max-width:200px;order:-1}}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s}
.step{border-top:2px solid var(--sepia);padding-top:14px;display:grid;gap:6px}
.step b{font-family:var(--f-mono);font-size:.8rem;color:var(--gold)}
.step p{color:var(--ink-soft);font-size:.95rem}
@media (max-width:700px){.steps{grid-template-columns:1fr}}
.worlds{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.world{display:grid;gap:8px;align-content:start;padding:20px;border-radius:8px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.world:hover{border-color:var(--gold)}
.world .ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);color:var(--sepia)}
.world .ico svg{width:22px;height:22px}
.world p{font-size:.92rem;color:var(--ink-soft)}
.world span{font-size:.88rem;font-weight:600;color:var(--sepia)}
@media (max-width:900px){.worlds{grid-template-columns:1fr 1fr}}
@media (max-width:440px){.worlds{grid-template-columns:1fr}}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}
.sec-head > div{display:grid;gap:6px;min-width:0}

/* Cartes cours / quiz */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.item{display:grid;grid-template-rows:auto 1fr auto;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cover{aspect-ratio:16/7;display:grid;place-items:center;position:relative;background:var(--sepia);color:var(--on-sepia);font-family:var(--f-display);font-size:1.8rem;letter-spacing:.1em}
.cover .lvl{position:absolute;top:10px;left:10px;font:500 .68rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;background:var(--on-sepia);color:var(--sepia);padding:3px 8px;border-radius:999px}
.cover .done{position:absolute;top:10px;right:10px;font:500 .68rem var(--f-mono);background:var(--gold-hi);color:#3A2410;padding:3px 8px;border-radius:999px}
.item-body{padding:16px;display:grid;gap:8px;align-content:start}
.item-body h3{font-size:1.08rem;line-height:1.3}
.item-body p{font-size:.92rem;color:var(--ink-soft)}
.item-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 16px 16px}
.meta{font:500 .74rem var(--f-mono);color:var(--ink-soft)}

/* Lecteur : leçon et quiz */
.player{max-width:720px;margin:0 auto;width:100%;display:grid;gap:22px}
.back{justify-self:start;background:none;border:0;color:var(--sepia);font:600 .92rem var(--f-body);cursor:pointer;padding:0}
.bar{height:6px;border-radius:999px;background:var(--paper-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.lesson-text{display:grid;gap:14px;font-size:1.05rem}
.lesson-text p{max-width:65ch}
.q{font-family:var(--f-display);font-size:clamp(1.2rem,2.6vw,1.55rem);line-height:1.3}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;font-size:1rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:500 .8rem var(--f-mono);background:var(--paper-2);color:var(--sepia)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.right .k{background:var(--ok);color:var(--card)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:var(--card)}
.opt:disabled{cursor:default}
.explain{border-left:3px solid var(--gold);padding:10px 14px;background:var(--card);border-radius:0 6px 6px 0;font-size:.95rem}
.explain b{display:block;font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
.explain.ok b{color:var(--ok)} .explain.ko b{color:var(--bad)}
.qtop{display:flex;justify-content:space-between;gap:12px;font:500 .8rem var(--f-mono);color:var(--ink-soft)}
.result{text-align:center;display:grid;gap:14px;justify-items:center;padding:24px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.score{font-family:var(--f-display);font-size:3.4rem;line-height:1;color:var(--sepia);font-variant-numeric:tabular-nums}
.newbadges{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}

/* Badges et profil */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.badge{display:grid;gap:6px;justify-items:center;text-align:center;padding:18px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.badge .seal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.2rem;border:2px solid var(--gold);color:var(--sepia);background:var(--paper-2)}
.badge.locked{opacity:.45}
.badge.locked .seal{border-style:dashed;border-color:var(--line)}
.badge b{font-family:var(--f-display);font-size:.95rem}
.badge small{font-size:.8rem;color:var(--ink-soft)}
.pill{font:500 .74rem var(--f-mono);padding:4px 10px;border-radius:999px;border:1px solid var(--gold);color:var(--sepia);background:var(--card)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.stat b{display:block;font-family:var(--f-display);font-size:1.8rem;color:var(--sepia);font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--ink-soft)}
@media (max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.rank{display:flex;align-items:center;gap:16px;padding:18px;border-radius:10px;background:var(--sepia);color:var(--on-sepia)}
.rank .seal{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold-hi);display:grid;place-items:center;font-family:var(--f-display);font-size:1.4rem;flex:none}
.rank p{opacity:.85;font-size:.92rem}
.lvlbar{height:6px;background:color-mix(in srgb,var(--on-sepia) 25%,transparent);border-radius:999px;margin-top:8px;overflow:hidden}
.lvlbar i{display:block;height:100%;background:var(--gold-hi)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Annuaire et bibliothèque */
.search{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;max-width:520px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.name{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:4px}
.name h3{font-size:1.25rem;color:var(--sepia)}
.name .meta{text-transform:uppercase;letter-spacing:.06em;font-size:.68rem}
.tag-ex{justify-self:start;font:500 .64rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--gold);color:var(--gold);padding:2px 6px;border-radius:3px}
.shelves{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.shelf{border:1px solid var(--line);border-radius:8px;padding:18px;background:var(--card);display:grid;gap:8px;align-content:start}
.shelf > b{font:500 .74rem var(--f-mono);color:var(--gold);letter-spacing:.1em;text-transform:uppercase}
.shelf ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.shelf a{text-decoration:none;color:var(--ink);font-size:.93rem;line-height:1.35;display:block}
.shelf a:hover{color:var(--sepia)}
.shelf small{display:block;font:400 .7rem var(--f-mono);color:var(--ink-soft)}
@media (max-width:860px){.shelves{grid-template-columns:1fr}}
.store{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.prod{border:1px dashed var(--line);border-radius:8px;padding:18px;display:grid;gap:6px}
.prod p{font-size:.92rem;color:var(--ink-soft)}
@media (max-width:860px){.store{grid-template-columns:1fr}}

/* En ligne : classement, code joueur */
.board{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-width:720px}
.board li{display:grid;grid-template-columns:2.2rem 44px 1fr auto;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.board li.me{border-color:var(--gold);background:var(--paper-2)}
.board .rk{font:700 1.1rem var(--f-display);color:var(--sepia);text-align:center;font-variant-numeric:tabular-nums}
.board li:nth-child(-n+3) .rk{color:var(--gold)}
.board .av,.board .av svg{width:44px;height:44px;display:block;align-self:center}
.board .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.board .pt{font:500 .9rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--sepia)}
.online{display:grid;gap:12px;padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.code{font:600 1.3rem var(--f-mono);letter-spacing:.08em;color:var(--sepia);user-select:all}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row2 input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0;flex:1 1 180px}
.check{display:flex!important;grid-template-columns:none!important;gap:10px!important;align-items:flex-start;color:var(--ink)!important}
.check input{margin-top:4px;width:18px;height:18px;flex:none}
.small{font-size:.85rem;color:var(--ink-soft)}
.prose{display:grid;gap:12px;max-width:68ch}
.prose h3{margin-top:8px}
/* Personnages */
.av{display:inline-block;flex:none;line-height:0}
.av svg{width:100%;height:100%;display:block}
.pts{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px}
.pts .av{width:28px;height:28px}
.modal{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#120b05 70%,transparent);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:640px;max-height:100%;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:18px}
.sheet h2{font-size:clamp(1.4rem,3vw,1.8rem)}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:480px){.avgrid{grid-template-columns:repeat(3,1fr)}}
.avpick{display:grid;justify-items:center;gap:6px;padding:10px 6px;border:2px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font:500 .78rem var(--f-body);color:var(--ink)}
.avpick .av{width:64px;height:64px}
.avpick[aria-pressed="true"]{border-color:var(--gold);background:var(--paper-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 30%,transparent)}
.avpick:hover{border-color:var(--gold)}
.sheet label{display:grid;gap:6px;font-size:.9rem;color:var(--ink-soft)}
.sheet input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.me{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.me .av{width:88px;height:88px}
.me b{font-family:var(--f-display);font-size:1.4rem;display:block;overflow-wrap:anywhere}
.me > div{flex:1 1 160px}
footer{border-top:1px solid var(--line);padding-block:24px;font-size:.85rem;color:var(--ink-soft)}
</style>

 {id:"c1908",mono:"1908",lvl:1,min:5,title:"15 novembre 1908 : le Congo devient belge",
  sum:"Comment la propriété personnelle d'un roi est devenue une colonie.",
  text:["En 1885, à la conférence de Berlin, les puissances européennes reconnaissent l'État indépendant du Congo. Ce territoire immense n'appartient pas à la Belgique : il est la propriété personnelle du roi Léopold II.",
        "L'exploitation du caoutchouc et de l'ivoire s'accompagne de violences terribles contre les populations : travail forcé, otages, mains coupées. Au début du XXe siècle, des missionnaires, des journalistes et des diplomates les dénoncent devant le monde entier.",
        "Sous cette pression, la Belgique reprend le territoire. Le 15 novembre 1908, l'État indépendant du Congo devient le Congo belge, une colonie de l'État belge. Il le restera jusqu'à l'indépendance du 30 juin 1960."],
  qs:[{q:"Avant 1908, à qui appartenait l'État indépendant du Congo ?",o:["À la Belgique","Au roi Léopold II","À la France","À l'Angleterre"],a:1,e:"C'était la propriété personnelle du roi Léopold II, pas celle de l'État belge."},
      {q:"Que devient le Congo le 15 novembre 1908 ?",o:["Un pays indépendant","Une colonie belge","Un protectorat français","Une république"],a:1,e:"La Belgique annexe le territoire, qui devient le Congo belge."},
      {q:"Jusqu'à quelle année le Congo reste-t-il une colonie belge ?",o:["1945","1955","1960","1965"],a:2,e:"Le Congo devient indépendant le 30 juin 1960."}]},
 {id:"cboma",mono:"BOMA",lvl:1,min:4,title:"Boma, première capitale",
  sum:"Avant Kinshasa, le pouvoir siégeait sur l'estuaire du fleuve.",
  text:["Boma est une ville portuaire sur l'estuaire du fleuve Congo, près de l'océan Atlantique. Depuis des siècles, c'est un lieu d'échanges commerciaux.",
        "Elle devient la capitale de l'État indépendant du Congo, puis du Congo belge. Sa position près de la mer facilite les liaisons avec l'Europe.",
        "Dans les années 1920, la capitale est transférée à Léopoldville, l'actuelle Kinshasa, mieux placée au début de la partie navigable du fleuve vers l'intérieur du pays."],
  qs:[{q:"Sur quel fleuve se trouve Boma ?",o:["Le Nil","Le fleuve Congo","Le Kasaï","L'Oubangui"],a:1,e:"Boma est sur l'estuaire du fleuve Congo, près de l'Atlantique."},
      {q:"Quelle ville a remplacé Boma comme capitale ?",o:["Lubumbashi","Kisangani","Léopoldville (Kinshasa)","Matadi"],a:2,e:"La capitale est transférée à Léopoldville, devenue Kinshasa."},
      {q:"Pourquoi la position de Boma était-elle utile ?",o:["Elle est en montagne","Elle est proche de la mer","Elle est au centre du pays","Elle est près du Katanga"],a:1,e:"Sa proximité avec l'océan facilitait les liaisons avec l'Europe."}]},
 {id:"crumba",mono:"RUMBA",lvl:1,min:5,title:"La rumba congolaise, des origines à l'UNESCO",
  sum:"D'une musique de quartier à un patrimoine de l'humanité.",
  text:["La rumba congolaise est née dans les villes de Léopoldville et de Brazzaville, de part et d'autre du fleuve. Elle mêle des rythmes venus d'Afrique centrale et des influences de la musique cubaine, elle-même héritière de rythmes africains.",
        "Des orchestres comme l'OK Jazz de Franco ou l'African Jazz de Joseph Kabasele (Grand Kallé) en font la musique de toute une époque. « Indépendance Cha Cha » accompagne la fête de 1960.",
        "En décembre 2021, l'UNESCO inscrit la rumba congolaise au patrimoine culturel immatériel de l'humanité, sur une candidature commune de la RDC et de la République du Congo."],
  qs:[{q:"En quelle année la rumba congolaise est-elle inscrite à l'UNESCO ?",o:["2011","2016","2021","2024"],a:2,e:"Elle est inscrite en décembre 2021."},
      {q:"Quels pays ont porté la candidature ensemble ?",o:["RDC et Angola","RDC et République du Congo","RDC et Cameroun","RDC et Rwanda"],a:1,e:"Les deux Congo, de part et d'autre du fleuve, ont présenté une candidature commune."},
      {q:"Quelle chanson accompagne la fête de l'indépendance en 1960 ?",o:["Indépendance Cha Cha","Mario","Shauri Yako","Mokolo nakokufa"],a:0,e:"« Indépendance Cha Cha », de Grand Kallé et l'African Jazz."}]},
 {id:"ckimb",mono:"NKAMBA",lvl:2,min:5,title:"Simon Kimbangu et le kimbanguisme",
  sum:"Le prophète de Nkamba et l'Église qui porte son nom.",
  text:["En 1921, à Nkamba, dans l'actuel Kongo-Central, Simon Kimbangu commence à prêcher. Des foules viennent l'écouter, et on lui attribue des guérisons.",
        "L'administration coloniale voit dans ce mouvement une menace. Kimbangu est arrêté la même année et condamné. Il passe trente ans en prison à Élisabethville, l'actuelle Lubumbashi, où il meurt en 1951.",
        "Ses fidèles continuent malgré la répression. L'Église kimbanguiste est reconnue officiellement en 1959. Elle est aujourd'hui l'une des plus grandes Églises africaines indépendantes."],
  qs:[{q:"Dans quel village Simon Kimbangu commence-t-il à prêcher ?",o:["Nkamba","Boma","Mbanza-Ngungu","Kikwit"],a:0,e:"Nkamba, dans l'actuel Kongo-Central, est devenu un lieu saint pour les kimbanguistes."},
      {q:"Où Kimbangu meurt-il en prison ?",o:["Léopoldville","Élisabethville (Lubumbashi)","Stanleyville","Bruxelles"],a:1,e:"Il meurt en 1951 à Élisabethville, après trente ans de détention."},
      {q:"En quelle année l'Église kimbanguiste est-elle reconnue ?",o:["1921","1951","1959","1971"],a:2,e:"Elle est reconnue officiellement en 1959, un an avant l'indépendance."}]}
,
 {id:"ckongo",mono:"KONGO",lvl:2,min:6,title:"Le royaume Kongo, un État de cinq siècles",
  sum:"Mbanza Kongo, Afonso Ier et Kimpa Vita.",
  src:["UNESCO, Mbanza Kongo (patrimoine mondial, 2017)","AfricaMuseum, « The Kongo kingdom »"],
  text:["Selon les traditions orales, le royaume Kongo naît à la fin du XIVe siècle. Son premier roi, Lukeni lua Nimi, fait de Mbanza Kongo sa capitale. À son apogée, le royaume couvre une partie de l'Angola, de la RDC et de la République du Congo actuels.",
        "Les Portugais arrivent dans les années 1480. En 1491, le roi Nzinga a Nkuwu se convertit au catholicisme. Son fils Mvemba a Nzinga, devenu Afonso Ier, règne de 1509 à 1542 environ. Il ouvre des écoles, envoie des jeunes nobles étudier en Europe et écrit aux rois du Portugal et au pape. Mais il refuse que les Portugais s'installent librement à l'intérieur de son royaume.",
        "Au début du XVIIIe siècle, une jeune femme, Kimpa Vita (Dona Beatriz), prêche pour réunifier le royaume divisé par les guerres. Elle est condamnée et brûlée en 1706. Aujourd'hui, Mbanza Kongo, en Angola, est inscrite au patrimoine mondial de l'UNESCO depuis 2017."],
  qs:[{q:"Quelle était la capitale du royaume Kongo ?",o:["Boma","Mbanza Kongo","Luanda","Kinshasa"],a:1,e:"Mbanza Kongo, aujourd'hui en Angola, inscrite au patrimoine mondial de l'UNESCO en 2017."},
      {q:"Quel roi kongo a ouvert des écoles et écrit au pape ?",o:["Afonso Ier","Lukeni lua Nimi","Pedro II","Garcia II"],a:0,e:"Afonso Ier (Mvemba a Nzinga), qui règne de 1509 à 1542 environ."},
      {q:"Qui était Kimpa Vita ?",o:["Une reine du Ndongo","Une prophétesse kongo","Une missionnaire portugaise","Une commerçante de Boma"],a:1,e:"Kimpa Vita, ou Dona Beatriz, prêchait la réunification du royaume. Elle est exécutée en 1706."}]}
,
 {id:"clumumba",mono:"LUMUMBA",lvl:2,min:6,title:"Patrice Lumumba, du bureau de poste à la primature",
  sum:"Le premier Premier ministre du Congo indépendant, de Onalua à son mausolée.",
  src:["Encyclopædia Britannica, « Patrice Lumumba »","New York Public Library, Patrice Lumumba Resource Guide","BBC News, 20 et 30 juin 2022"],
  text:["Patrice Lumumba naît le 2 juillet 1925 à Onalua, dans le Kasaï, au sein du petit peuple tetela. Il devient commis des postes à Stanleyville (aujourd'hui Kisangani). Il lit beaucoup, écrit des articles et des poèmes, et parle le tetela, le français, le lingala, le swahili et le tshiluba.",
        "En octobre 1958, il lance avec d'autres dirigeants le Mouvement national congolais (MNC), le premier parti présent dans tout le pays. Emprisonné en 1959, il est libéré pour participer à la Table ronde de Bruxelles. Le MNC arrive en tête des élections de mai 1960 et Lumumba forme le premier gouvernement le 24 juin 1960. Le 30 juin, jour de l'indépendance, son discours devant le roi Baudouin rappelle les humiliations de la colonisation.",
        "Le 5 septembre 1960, le président Kasa-Vubu le révoque. Arrêté, Lumumba est livré au Katanga et assassiné le 17 janvier 1961 avec ses compagnons Maurice Mpolo et Joseph Okito. Le 20 juin 2022, la Belgique rend à sa famille une dent, seul reste connu de son corps. Elle est inhumée le 30 juin 2022 dans un mausolée à Kinshasa."],
  qs:[{q:"Dans quelle ville Lumumba travaillait-il comme commis des postes ?",o:["Léopoldville","Stanleyville","Élisabethville","Boma"],a:1,e:"À Stanleyville, l'actuelle Kisangani, où son mouvement restera très fort."},
      {q:"Quel parti Lumumba lance-t-il en 1958 ?",o:["L'ABAKO","La CONAKAT","Le MNC","Le MPR"],a:2,e:"Le Mouvement national congolais, le premier parti présent dans tout le pays."},
      {q:"En quelle année la Belgique rend-elle la dent de Lumumba à sa famille ?",o:["1997","2011","2022","2025"],a:2,e:"Le 20 juin 2022. Elle est inhumée à Kinshasa le 30 juin 2022."}]}
,
 {id:"ckuba",mono:"KUBA",lvl:2,min:5,title:"Le royaume Kuba et les statues ndop",
  sum:"Entre le Kasaï et le Sankuru, des rois sculptés pour l'éternité.",
  src:["Smarthistory, « Ndop Portrait of King Mishé miShyááng máMbúl »","Brooklyn Museum, collection en ligne (objet 61.33)"],
  text:["Le royaume Kuba se trouve au sud de la forêt équatoriale, entre deux rivières, le Kasaï et le Sankuru. À partir du XVIIe siècle, plusieurs peuples s'y rassemblent et forment un royaume durable. Le nom « Kuba » désigne dix-neuf groupes apparentés qui reconnaissent tous le même roi, le nyim.",
        "Les artistes kuba (sculpteurs, forgerons, tisserands) travaillaient pour le nyim. Leur œuvre la plus vénérée est le ndop, mot qui veut dire « statue » : un portrait en bois du roi assis en tailleur. Ce n'est pas un portrait ressemblant mais l'image du roi idéal. La tête mesure un tiers de la statue, car elle est le siège de l'intelligence.",
        "Chaque roi choisit un emblème, l'ibol, sculpté sur le socle de son ndop : c'est lui qui permet de savoir quel roi est représenté. Celui du roi Mishé miShyááng máMbúl est un tambour. Plusieurs ndop ont été emportés en Europe à l'époque coloniale. On peut les voir au British Museum, au musée royal de l'Afrique centrale en Belgique et au Brooklyn Museum."],
  qs:[{q:"Entre quelles rivières se trouve le royaume Kuba ?",o:["Le Congo et l'Oubangui","Le Kasaï et le Sankuru","Le Lualaba et le Lomami","Le Kwango et le Kwilu"],a:1,e:"Le royaume Kuba s'étend entre le Kasaï et le Sankuru, au sud de la forêt équatoriale."},
      {q:"Comment s'appelle le roi des Kuba ?",o:["Le Mwant Yav","Le Manikongo","Le nyim","Le mulopwe"],a:2,e:"Le nyim est le roi reconnu par les dix-neuf groupes kuba."},
      {q:"À quoi sert l'ibol sculpté sur le socle d'un ndop ?",o:["À signer le sculpteur","À identifier le roi représenté","À indiquer la date","À protéger la statue"],a:1,e:"L'ibol est l'emblème choisi par chaque roi : il permet de savoir qui la statue représente."}]}
,
 {id:"cmobutu",mono:"ZAÏRE",lvl:2,min:6,title:"Mobutu et le Zaïre, 1965–1997",
  sum:"Du journaliste de Léopoldville au maréchal qui rebaptisa le pays.",
  src:["Encyclopædia Britannica, « Mobutu Sese Seko » (mise à jour d'octobre 2026)"],
  text:["Joseph-Désiré Mobutu naît le 14 octobre 1930 à Lisala. En 1949, il entre dans la Force publique, l'armée coloniale, où il devient sergent-major, le plus haut grade alors ouvert aux Africains. Après l'armée, il devient journaliste à Léopoldville, rencontre Patrice Lumumba et rejoint le MNC.",
        "À l'indépendance, il est nommé secrétaire d'État à la Défense, puis devient commandant en chef de l'armée. En novembre 1965, profitant de la rivalité entre le président Kasa-Vubu et le Premier ministre Moïse Tshombe, il prend le pouvoir par un coup d'État. Son parti, le Mouvement populaire de la révolution (MPR), reste le seul parti autorisé jusqu'en 1990.",
        "Au nom de l'« authenticité », il africanise les noms : en octobre 1971, le pays devient la République du Zaïre, et en janvier 1972 il prend le nom de Mobutu Sese Seko. Corruption et mauvaise gestion ruinent les infrastructures. En mai 1997, chassé par la rébellion de Laurent-Désiré Kabila, il quitte le pouvoir ; le pays redevient la République démocratique du Congo. Il meurt en exil à Rabat, au Maroc, le 7 septembre 1997."],
  qs:[{q:"Dans quelle armée Mobutu commence-t-il sa carrière en 1949 ?",o:["La Force publique","L'armée belge","Les FARDC","La garde présidentielle"],a:0,e:"La Force publique était l'armée du Congo belge. Il y devient sergent-major."},
      {q:"Quel parti est le seul autorisé sous Mobutu jusqu'en 1990 ?",o:["Le MNC","L'ABAKO","Le MPR","L'UDPS"],a:2,e:"Le Mouvement populaire de la révolution (MPR)."},
      {q:"Où Mobutu meurt-il en 1997 ?",o:["À Gbadolite","À Paris","À Rabat","À Bruxelles"],a:2,e:"Il meurt en exil à Rabat, au Maroc, le 7 septembre 1997, et y est enterré."}]}
,
 {id:"ckasavubu",mono:"ABAKO",lvl:2,min:5,title:"Joseph Kasa-Vubu, premier président du Congo",
  sum:"De l'instituteur de Tshela au chef de l'État, 1960–1965.",
  src:["Encyclopædia Britannica, « Joseph Kasavubu » (mise à jour de mars 2026)"],
  text:["Joseph Kasa-Vubu naît vers 1910 à Tshela, dans le Bas-Congo. Formé par des missionnaires catholiques, il devient instituteur. En 1942, il entre dans l'administration coloniale et atteint le grade de commis-chef, le plus haut poste alors ouvert aux Congolais.",
        "Membre du peuple bakongo, il prend en 1955 la tête de l'ABAKO (Alliance des Ba-Kongo), une association culturelle devenue mouvement politique. Il défend un Congo indépendant à structure fédérale. En 1957, l'ABAKO remporte les premières élections municipales de Léopoldville et Kasa-Vubu devient bourgmestre de la commune de Dendale.",
        "Aux élections de 1960, ni le MNC de Lumumba ni l'ABAKO ne peuvent gouverner seuls : Kasa-Vubu devient président et Lumumba Premier ministre. Le 5 septembre 1960, Kasa-Vubu révoque Lumumba. Il reste président jusqu'au coup d'État de Mobutu en novembre 1965, puis se retire dans sa ferme près de Boma, où il meurt le 24 mars 1969."],
  qs:[{q:"Quel parti Joseph Kasa-Vubu dirigeait-il ?",o:["Le MNC","L'ABAKO","La CONAKAT","Le MPR"],a:1,e:"L'Alliance des Ba-Kongo, dont il prend la tête en 1955."},
      {q:"Quel métier Kasa-Vubu a-t-il exercé avant la politique ?",o:["Militaire","Instituteur","Commerçant","Médecin"],a:1,e:"Formé par des missionnaires catholiques, il fut d'abord instituteur, puis commis dans l'administration."},
      {q:"Quel type d'État Kasa-Vubu défendait-il ?",o:["Un État fédéral","Une monarchie","Un État unitaire très centralisé","Une union avec la Belgique"],a:0,e:"Il voulait un Congo fédéral, laissant de l'autonomie aux régions, contrairement à Lumumba qui défendait un État unitaire."}]}
,
 {id:"ckisangani",mono:"BOYOMA",lvl:1,min:5,title:"Kisangani, la ville des chutes Boyoma",
  sum:"De Stanleyville à Kisangani, la grande ville du nord sur le fleuve.",
  src:["Encyclopædia Britannica, « Kisangani » (sept. 2026)","Encyclopædia Britannica, « Congo River » (juin 2026)"],
  text:["Kisangani se trouve au nord-est de la RDC, sur le fleuve Congo, juste en aval des chutes Boyoma (autrefois chutes Stanley). Ces chutes forment sept cataractes qui bloquent la navigation sur environ 90 km. C'est le plus grand port intérieur du pays après Kinshasa.",
        "La ville est fondée en 1883 par des Européens. Elle s'appelle d'abord « Falls Station », puis Stanleyville, du nom de l'explorateur Henry Morton Stanley. Elle prend le nom de Kisangani en 1966. Depuis la fin du XIXe siècle, c'est le grand centre du nord du Congo, et un mémorial à Patrice Lumumba s'y dresse.",
        "Kisangani possède une université (l'ancienne Université libre du Congo, fondée en 1963, devenue Université de Kisangani en 1981) et un aéroport international ouvert en 1974. Le fleuve qui la traverse est le deuxième plus long d'Afrique, environ 4 700 km. Les Européens l'appelaient « Zaïre », déformation d'un mot local qui veut simplement dire « rivière »."],
  qs:[{q:"Quel était l'ancien nom de Kisangani ?",o:["Léopoldville","Élisabethville","Stanleyville","Coquilhatville"],a:2,e:"Stanleyville, du nom de l'explorateur Henry Morton Stanley. La ville devient Kisangani en 1966."},
      {q:"Comment s'appellent les chutes situées juste en amont de Kisangani ?",o:["Les chutes Inga","Les chutes Boyoma","Les chutes de la Lofoi","Les chutes Zongo"],a:1,e:"Les chutes Boyoma, autrefois chutes Stanley : sept cataractes sur environ 90 km."},
      {q:"Que veut dire le mot d'origine de « Zaïre », ancien nom du fleuve ?",o:["Grand serpent","Rivière","Mer","Roi"],a:1,e:"« Zaïre » vient d'un mot local (nzadi, nzari…) qui signifie simplement « rivière »."}]}
,
 {id:"clubumbashi",mono:"CUIVRE",lvl:1,min:5,title:"Lubumbashi, la capitale du cuivre",
  sum:"D'Élisabethville à Lubumbashi, la deuxième ville du pays.",
  src:["Encyclopædia Britannica, « Lubumbashi »","Encyclopædia Britannica, « Patrice Lumumba » (oct. 2026)"],
  text:["Lubumbashi est la deuxième ville de la RDC et le grand centre industriel de la région minière du sud-est, à environ 180 km de Ndola, en Zambie. Son nom vient d'une petite rivière locale, la Lubumbashi.",
        "La ville est fondée en 1910 par des colons belges comme cité minière du cuivre, sous le nom d'Élisabethville. Elle devient Lubumbashi en 1966. La plupart des compagnies minières de la région y ont leur siège, et c'est par elle que passent le cuivre, le cobalt, le zinc et l'étain venus de Likasi, Kolwezi ou Kipushi. Des voies ferrées la relient à l'océan Atlantique comme à l'océan Indien.",
        "Pendant la sécession du Katanga (1960–1963), Élisabethville en est le centre. C'est là que Patrice Lumumba, Maurice Mpolo et Joseph Okito sont conduits le 17 janvier 1961. La ville possède aujourd'hui une université fondée en 1955, un musée national, une cathédrale catholique et la Société des historiens du Congo."],
  qs:[{q:"Quel était le nom de Lubumbashi avant 1966 ?",o:["Stanleyville","Élisabethville","Jadotville","Albertville"],a:1,e:"La ville fondée en 1910 s'appelait Élisabethville. Elle devient Lubumbashi en 1966."},
      {q:"Pour exploiter quel métal la ville a-t-elle été fondée ?",o:["L'or","Le diamant","Le cuivre","Le fer"],a:2,e:"Lubumbashi est née en 1910 comme cité minière du cuivre."},
      {q:"D'où vient le nom « Lubumbashi » ?",o:["D'un roi lunda","D'une petite rivière locale","D'un explorateur","D'un mot swahili pour « mine »"],a:1,e:"Lubumbashi est le nom d'une petite rivière locale."}]}
,
 {id:"cvirunga",mono:"VIRUNGA",lvl:1,min:5,title:"Les Virunga, le plus ancien parc d'Afrique",
  sum:"Volcans, gorilles de montagne et neiges du Rwenzori.",
  src:["UNESCO, Centre du patrimoine mondial, « Parc national des Virunga »"],
  text:["Le parc national des Virunga, dans l'est de la RDC, est protégé depuis 1925 : c'est le plus ancien parc national d'Afrique. Il s'étend sur 790 000 hectares, et l'UNESCO l'a inscrit au patrimoine mondial. Il va de 680 m d'altitude jusqu'aux glaciers du Rwenzori, où le pic Marguerite (5 109 m) est le troisième sommet d'Afrique.",
        "Le parc abrite les deux volcans les plus actifs d'Afrique, le Nyiragongo et le Nyamuragira. Au fond du cratère du Nyiragongo se trouve un lac de lave presque permanent, qui se vide parfois avec des conséquences graves pour les habitants de la région.",
        "Sa faune est exceptionnelle : environ un tiers des gorilles de montagne du monde, quelque 20 000 hippopotames sur le lac Édouard et les rivières, plus de 700 espèces d'oiseaux, et l'okapi, qui ne vit qu'en RDC. Le parc est géré par l'ICCN, dont de nombreux gardes ont perdu la vie en le protégeant."],
  qs:[{q:"Depuis quelle année les Virunga sont-ils un parc national ?",o:["1885","1925","1960","1979"],a:1,e:"Le parc est protégé depuis 1925, ce qui en fait le plus ancien parc national d'Afrique."},
      {q:"Quel volcan des Virunga possède un lac de lave dans son cratère ?",o:["Le Kilimandjaro","Le Nyiragongo","Le mont Cameroun","Le Karisimbi"],a:1,e:"Le Nyiragongo, l'un des deux volcans les plus actifs d'Afrique avec le Nyamuragira."},
      {q:"Quelle part des gorilles de montagne du monde vit dans le parc ?",o:["Un dixième","Un tiers","La moitié","Tous"],a:1,e:"Selon l'UNESCO, le parc abrite environ un tiers de la population mondiale de gorilles de montagne."}]}
,
 {id:"clunda",mono:"LUNDA",lvl:2,min:6,title:"Le Mwaant Yav et la cour royale lunda",
  sum:"Rweej, le chasseur Cibind Yiruung et le bracelet lukano.",
  src:["D. Biebuyck, « Fondements de l'organisation politique des Lunda du Mwaantayaav en territoire de Kapanga », enquête de terrain d'avril 1957 (Bibliothèque Sikuzani)"],
  text:["Le Mwaant Yav est le souverain suprême des Lunda. Sa capitale est le village royal de Musumba, dans le territoire de Kapanga, au Katanga. En avril 1957, le Mwaant Yav Mbaku Ditend y réunit quelque 1 500 notables et gardiens des traditions pour raconter à un chercheur l'histoire et l'organisation de leur royaume.",
        "Selon la tradition racontée par les initiateurs de la rivière Nkalaany (la Bushimaie), le vieux chef Nkond fut un jour maltraité par ses fils. Sa fille Rweej prit sa défense, et il lui confia le pouvoir. Sous son règne arriva un chasseur luba, Cibind Yiruung, avec ses compagnons. Rweej l'épousa, et de cette union naît la dynastie des Mwaant Yav. Certains frères de Rweej partirent alors vers l'Angola, où leurs descendants fondèrent d'autres peuples.",
        "Le symbole suprême du pouvoir est le bracelet lukano. Lors des grandes assemblées, les dignitaires s'assoient autour du Mwaant Yav en quatre « côtés ». La Swanamulunda, mère symbolique de tous les Lunda, siège derrière lui. Un dignitaire, le Kanampumba ou « faux chef », s'assoit sur le siège royal lors de l'intronisation d'un nouveau Mwaant Yav, et ne le cède que contre un paiement."],
  qs:[{q:"Comment s'appelle le village royal où réside le Mwaant Yav ?",o:["Mbanza Kongo","Musumba","Nkamba","Kasongo"],a:1,e:"Musumba, dans le territoire de Kapanga, au Katanga."},
      {q:"Quel objet est le symbole suprême du pouvoir lunda ?",o:["Une couronne de plumes","Le bracelet lukano","Un tambour royal","Une lance d'ivoire"],a:1,e:"Le bracelet lukano, gardé à l'origine par les chefs de terre de la Nkalaany."},
      {q:"Selon la tradition, qui était Cibind Yiruung ?",o:["Un roi kongo","Un chasseur luba qui épousa la cheffesse Rweej","Un missionnaire portugais","Le frère de Rweej"],a:1,e:"Ce chasseur luba arriva sous le règne de Rweej et l'épousa : de leur union naît la dynastie des Mwaant Yav."}]},
 {id:"cluntu",mono:"LUNTU",lvl:2,min:6,title:"Les Bakwa Luntu, peuple de la termitière rouge",
  sum:"Du Katanga au Kasaï : l'ancêtre Mpongo Luntu, les 32 lignages et le récit de la termitière rouge.",
  src:["J.-R. Kabasele Dyckoba, L'origine mythologique des Bakwa Luntu, territoire de Dimbelenge, Ouagadougou, 2023 (Bibliothèque Sikuzani)","J.-R. Kapena Ditholo, travail de fin d'études sur les Bena Kalala, 1973, cité dans le même document"],
  text:["Les Bakwa Luntu vivent dans le territoire de Dimbelenge, au Kasaï central. Comme les autres peuples de langue luba, ils rattachent leurs ancêtres à Nsanga Lubangu, un lieu situé vers Kamina, considéré comme le grand foyer d'où sont parties les familles luba. Les Bena Kalala, étudiés sur le terrain en 1973 par J.-R. Kapena Ditholo, sont l'une de leurs branches.",
        "Selon les traditions, le groupe Luntu serait apparu lors de la dislocation du premier empire luba, vers le milieu du 16e siècle. Fuyant les conflits civils et les famines du Katanga, il serait arrivé au Kasaï au 17e siècle, puis sur les terres de Dimbelenge entre 1750 et 1800, d'après Mabika Kalanda. Les Luntu se reconnaissent un ancêtre mythique, Mpongo Luntu, père de cinq branches divisées en 32 « bifuku », ou lignages.",
        "La tradition orale résume leur origine en une formule : « Luntu wa mu mutunda mukunze », l'humain qui habite la termitière rouge. Un autre récit raconte que les Luntu se sont élevés si haut qu'ils ont touché le ciel avec un bâton, et que le ciel s'est effondré. Les enfants le chantent encore dans une comptine : la mère vit au sommet, là où arrive le soleil mais jamais la pluie, et descend acheter chez les voisins, les Bakwa Dishi, une vache, un cheval et des outres d'huile."],
  qs:[{q:"De quel lieu mythique les peuples de langue luba disent-ils venir ?",o:["Nsanga Lubangu","Musumba","Mbanza Kongo","Nyangwe"],a:0,e:"Nsanga Lubangu, situé vers Kamina, est présenté comme le grand foyer des familles luba."},
      {q:"Que signifie la formule « Luntu wa mu mutunda mukunze » ?",o:["Luntu, le chasseur du fleuve","L'humain qui habite la termitière rouge","Le roi de la colline","Le peuple de la pluie"],a:1,e:"Mutunda signifie termitière et mukunze rouge."},
      {q:"Selon le récit, que s'est-il passé quand les Luntu ont touché le ciel avec un bâton ?",o:["Il s'est mis à pleuvoir","Le ciel s'est effondré","Le soleil a disparu","Les ancêtres sont descendus"],a:1,e:"« Diulu ekumvwa nanku e kupukadio » : le ciel, se sentant touché, s'est écroulé."}]},
 {id:"cmboko",mono:"MBOKO",lvl:2,min:6,title:"Le kaolin sacré des Luba",
  sum:"La terre blanche, la calebasse mboko et le lien entre les vivants et les esprits.",
  src:["Pierre Petit, « Le kaolin sacré et les porteuses de coupe luba du Shaba », Musée royal de l'Afrique centrale, Tervuren (Bibliothèque Sikuzani)"],
  text:["Chez les Luba du Katanga, deux sortes d'esprits comptent : les ancêtres (mufu) et les vidye, des esprits très puissants qui parlent par la bouche des médiums, les kilumbu. Pour entrer en contact avec eux, on utilise le kaolin, une terre blanche appelée mpemba. Autrefois, à chaque nouvelle lune, le chef de famille poudrait de kaolin le front et la poitrine des siens, devant de petites huttes réservées aux esprits, les kabafu ou « petites maisons des morts ».",
        "Le kaolin est gardé dans une calebasse appelée mboko, un mot de la même famille que kiboko, la prospérité. Le chef reçoit son mboko lors de son intronisation : c'est le signe de son alliance avec les esprits. Selon la tradition, le kaolin du roi venait des grands esprits Mpanga et Banze, à Kalui. Le médium, lui, secoue son mboko, puis lit dans les petits objets apparus à la surface du kaolin l'origine du malheur de son client.",
        "Pour les Luba, le kaolin est lié au monde des esprits, dont le lac Upemba est la grande image : son nom vient d'ailleurs du même mot que mpemba. Les Kongo appellent aussi mpemba à la fois le kaolin et le pays blanc où vivent les esprits. L'importance du kaolin reste forte : en 1960, des jeunes guerriers demandèrent au roi Kabongo II du kaolin pour partir au combat avec la bénédiction des ancêtres."],
  qs:[{q:"Comment s'appelle le kaolin, la terre blanche sacrée des Luba ?",o:["Nkula","Mpemba","Malafu","Manga"],a:1,e:"Mpemba : le kaolin, au cœur de la communication avec les esprits."},
      {q:"Qu'est-ce que le mboko ?",o:["Un tambour royal","La calebasse qui contient le kaolin","Une danse de la nouvelle lune","Un masque de médium"],a:1,e:"Le mboko est la calebasse à kaolin ; son nom est lié à kiboko, la prospérité."},
      {q:"Quel lac porte un nom venu du même mot que le kaolin ?",o:["Le lac Tanganyika","Le lac Moero","Le lac Upemba","Le lac Kivu"],a:2,e:"Upemba (Bu-pemba) vient du même radical que mpemba, le kaolin."}]}
];

  {id:"qluntu",mono:"LUNTU",lvl:2,min:5,title:"Les Bakwa Luntu : mythe et tradition orale",sum:"Un peuple du Kasaï central, son ancêtre Mpongo Luntu et le récit de la termitière rouge.",

    qs:[

      {q:"Dans le récit « Luntu wa mu mutunda mukunze », où habite l'ancêtre ?",o:["Au bord du lac Munkamba","Dans une termitière rouge","Dans une grotte","Sur une île du fleuve"],a:1,e:"Mutunda signifie termitière et mukunze rouge : « l'humain qui habite la termitière rouge »."},
      {q:"Dans la comptine des enfants luntu, que va acheter la mère chez les Bakwa Dishi ?",o:["Du sel et des perles","Une vache, un cheval et des outres d'huile","Des houes et des lances","Du manioc et du poisson"],a:1,e:"La chanson dit qu'elle est partie acheter une vache, un cheval et des outres d'huile (tulowalowa twa manyi)."}]},

      {q:"Quelle porteuse de coupe est citée comme un chef-d'œuvre de l'art d'Afrique centrale ?",o:["Celle de Buli","Celle de Kinshasa","Celle de Boma","Celle de Kisangani"],a:0,e:"La porteuse de coupe du maître de Buli, entrée au musée de Tervuren en 1913."},
      {q:"Comment appelle-t-on les médiums luba qui entrent en transe ?",o:["Les mulopwe","Les kilumbu","Les mpetshi","Les tufunga"],a:1,e:"Les kilumbu, l'élite des devins, à travers qui parlent les esprits vidye."},

      {q:"Quel explorateur, le premier Occidental à atteindre le royaume luba, a vu des médiums avec leurs statues en 1874 ?",o:["Stanley","Livingstone","Cameron","Burton"],a:2,e:"L'explorateur Cameron, à Kohouédi, près de Kinkondja, en 1874."},
      {q:"Comment s'appelle le roi, ou chef sacré, chez les Luba ?",o:["Mani","Mulopwe","Mwaant Yav","Nyim"],a:1,e:"Mulopwe : le roi, mais aussi les chefs sacrés locaux."},
      {q:"Combien de porteuses de coupe l'auteur a-t-il recensées au musée de Tervuren ?",o:["12","31","54","100"],a:2,e:"54 pièces, dont 31 appartiennent à l'art luba et luba oriental."},
      {q:"Chez les Bwile de Zambie, en quoi s'est transformée la porteuse de coupe ?",o:["En porteuse de panier","En porteur de lance","En masque","En tabouret"],a:0,e:"Les Bwile sculptent une porteuse de panier, comme « Madame Jeanne », sculptée à Mpweto en 1993."}]}

   <label for="pcontact" id="pcwrap">${t("contactL")}<input id="pcontact" maxlength="80" placeholder="${t("contactPh")}"><span class="small">${t("contactP")} <a href="#confidentialite" target="_self">${t("privL")}</a></span></label>`:""}
   <p class="note" id="perr" aria-live="polite"></p>
   <div class="cta-row" style="margin:0"><button class="btn" id="pgo" ${pick?"":"disabled"}>${first?t("go2"):t("save")}</button><button class="btn ghost" id="plater">${first?t("later"):t("no")}</button></div></div>`;
  document.body.appendChild(m);
  const go=m.querySelector("#pgo");
  m.querySelector(".avgrid").onclick=e=>{const b=e.target.closest(".avpick");if(!b)return;pick=b.dataset.id;m.querySelectorAll(".avpick").forEach(x=>x.setAttribute("aria-pressed",x===b));go.disabled=false;};
  const close=()=>{m.remove();if(first){try{localStorage.setItem(KEY+"-asked","1")}catch(e){}}};
  m.querySelector("#plater").onclick=close;
  const pon=m.querySelector("#pon");if(pon)pon.onchange=()=>{m.querySelector("#pcwrap").hidden=!pon.checked};
  go.onclick=async()=>{P.av=pick;P.name=(m.querySelector("#pname").value||"").trim().slice(0,20);save();updPts();
    if(pon&&pon.checked){go.disabled=true;go.textContent=t("wait");
      try{const best={};for(const[k,v]of Object.entries(P.done))best[k]=v.best;
        const r=await api("/register",{name:P.name,av:P.av,consent:true,contact:m.querySelector("#pcontact").value,best});takeServer(r);}
      catch(e){m.querySelector("#perr").textContent=t("netErr");go.disabled=false;go.textContent=first?t("go2"):t("save");return;}}
    else if(P.code){api("/profile",{code:P.code,name:P.name,av:P.av}).catch(()=>{});}
    close();if(!S)route();};
  m.querySelector(".avpick[aria-pressed=true]")?.focus();
}
/* ---------- En ligne (Netlify Functions) ---------- */
let ONLINE=false, BOARD=null;
async function api(path,body){
  const r=await fetch("/api"+path,body?{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}:{});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(d.error||"Erreur"),{status:r.status});
  return d;
}
function takeServer(r){
  P.code=r.code;P.pid=r.id;P.name=r.name||P.name;P.av=r.av||P.av;
  for(const[k,v]of Object.entries(r.best||{})){if(!P.done[k]||P.done[k].best<v)P.done[k]={best:v}}
  P.pts=Math.max(P.pts,r.pts||0);save();updPts();
}
function pushScore(id,score){ if(!P.code||!ONLINE)return; api("/score",{code:P.code,item:id,score}).then(r=>{P.pts=Math.max(P.pts,r.pts);save();updPts();BOARD=null}).catch(()=>{}); }
async function loadBoard(){ try{BOARD=(await api("/board")).top;ONLINE=true}catch(e){BOARD=null} return BOARD; }
/* ---------- État (sur cet appareil) ---------- */

try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s.pts==="number")P=Object.assign(P,s);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
let L="fr";try{const v=localStorage.getItem("sk-lang");if(T[v])L=v;}catch(e){}
const t=k=>T[L][k]!==undefined?T[L][k]:T.fr[k];
const bt=b=>L==="en"?b.en:b.fr;
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rankOf=p=>{let r=RANKS[0],n=null;for(let i=0;i<RANKS.length;i++){if(p>=RANKS[i][0]){r=RANKS[i];n=RANKS[i+1]||null}}return{r,n}};
const rname=r=>L==="en"?r[2]:r[1];

function card(x,kind){

  <div class="item-body"><h3>${esc(x.title)}</h3><p>${esc(x.sum)}</p></div>
  <div class="item-foot"><span class="meta">${x.min} ${t("min")} · ${x.qs.length} ${t("qs")}</span><a class="btn" href="#${kind}-${x.id}">${kind==="quiz"?(d?t("replay"):t("play")):t("read")}</a></div></article>`;
}

</div>`;

 <p>Sikuzani Académie se joue sans compte. Si tu actives la sauvegarde en ligne, voici ce que nous enregistrons, et rien d'autre :</p>

 <div class="shelves">${LIB.map(s=>`<div class="shelf"><b>${s[0]}</b><ul>${s[1].map(d=>`<li><a href="${D+d[2]}/view" target="_blank" rel="noopener">${esc(d[0])}<small>${esc(d[1])}</small></a></li>`).join("")}</ul></div>`).join("")}</div></section></div>`;

 return `<div class="view"><section style="display:grid;gap:20px"><div><h2>${t("profH")}</h2><p class="lede">${t("profP")}</p></div>
 <div class="me"><span class="av">${avatar(P.av)}</span><div style="flex:1;min-width:0"><b>${esc(P.name||(P.av?avName(avById(P.av)):t("noName")))}</b><span class="meta">${P.av?avName(avById(P.av)):""}</span></div><button class="btn ghost" id="chav">${P.av?t("change"):t("chooseH")}</button></div>
 <div class="rank"><div class="seal">${rname(r)[0]}</div><div style="flex:1;min-width:0"><h3>${rname(r)}</h3><p>${n?`${n[0]-P.pts} pts ${t("rankNext")} · ${rname(n)}`:t("rankMax")}</p><div class="lvlbar"><i style="width:${pct}%"></i></div></div></div>
 <div class="stats"><div class="stat"><b>${P.pts}</b><span>${t("stPts")}</span></div><div class="stat"><b>${QUIZ.filter(q=>P.done[q.id]).length}/${QUIZ.length}</b><span>${t("stQ")}</span></div><div class="stat"><b>${COURS.filter(c=>P.done[c.id]).length}/${COURS.length}</b><span>${t("stC")}</span></div><div class="stat"><b>${P.perfect}</b><span>${t("stPerf")}</span></div></div>
 <h3>${t("badgesH")}</h3><div class="badges">${BADGES.map(b=>`<div class="badge ${P.badges.includes(b.id)?"":"locked"}"><div class="seal">${b.s}</div><b>${bt(b)[0]}</b><small>${bt(b)[1]}</small></div>`).join("")}</div>

function onlineBlock(){

  if(P.code) return `<div class="online"><p>${t("codeP")}</p><div class="row2"><span class="code" id="mycode">${esc(P.code)}</span><button class="btn ghost" id="cpcode">${t("copy")}</button></div>

/* ---------- Lecteur ---------- */
let S=null;
function openItem(kind,id){
  const list=kind==="quiz"?QUIZ:COURS, x=list.find(i=>i.id===id); if(!x){location.hash=kind;return}
  S={kind,x,i:0,score:0,answered:false,stage:kind==="cours"?"read":"q"}; drawPlayer();
}
function drawPlayer(){
  const {x,kind}=S;
  if(S.stage==="read"){
    app.innerHTML=`<div class="player"><a class="back" href="#cours">${t("back")}</a><div class="eyebrow">${t("lvl")} ${x.lvl} · ${x.min} ${t("min")}</div><h1 style="font-size:clamp(1.6rem,3.6vw,2.4rem)">${esc(x.title)}</h1>
     <div class="lesson-text">${x.text.map(p=>`<p>${esc(p)}</p>`).join("")}</div>${x.src?`<p class="meta">Sources : ${x.src.map(esc).join(" · ")}</p>`:""}<button class="btn" id="goq" style="justify-self:start">${t("toQ")}</button></div>`;
    $("#goq").onclick=()=>{S.stage="q";drawPlayer();scrollTo(0,0)}; return;
  }
  if(S.stage==="end") return drawEnd();
  const q=x.qs[S.i], n=x.qs.length;
  app.innerHTML=`<div class="player"><a class="back" href="#${kind}">${t("back")}</a>
   <div class="qtop"><span>${esc(x.title)}</span><span>${t("q")} ${S.i+1} ${t("of")} ${n}</span></div>
   <div class="bar"><i style="width:${S.i/n*100}%"></i></div>
   <p class="q">${esc(q.q)}</p>
   <div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${"ABCD"[j]}</span><span>${esc(o)}</span></button>`).join("")}</div>
   <div id="fb"></div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.j));
}
function answer(j){
  if(S.answered) return; S.answered=true;
  const q=S.x.qs[S.i], ok=j===q.a; if(ok) S.score++;
  app.querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.j;b.disabled=true;if(k===q.a)b.classList.add("right");else if(k===j)b.classList.add("wrong")});
  const last=S.i===S.x.qs.length-1;
  $("#fb").innerHTML=`<div class="explain ${ok?"ok":"ko"}"><b>${ok?t("right"):t("wrong")}</b>${esc(q.e)}</div><button class="btn" id="nx" style="margin-top:16px">${last?t("finish"):t("next")}</button>`;
  $("#nx").focus();
  $("#nx").onclick=()=>{S.answered=false;if(last){S.stage="end"}else S.i++;drawPlayer()};
}
function drawEnd(){
  const {x,kind,score}=S, n=x.qs.length, prev=P.done[x.id];
  const gained=Math.max(0,score-(prev?prev.best:0))*10;  // points only for improvement
  P.pts+=gained; P.done[x.id]={best:Math.max(score,prev?prev.best:0)};
  if(score===n && !(prev&&prev.best===n)) P.perfect++;
  const fresh=BADGES.filter(b=>!P.badges.includes(b.id)&&b.test(P)); fresh.forEach(b=>P.badges.push(b.id)); save(); updPts(); pushScore(x.id,P.done[x.id].best);
  app.innerHTML=`<div class="player"><a class="back" href="#${kind}">${t("back")}</a><div class="result">
   <div class="eyebrow">${t("res")}</div><div class="score">${score}/${n}</div><p class="lede">+${gained} ${t("earned")} · ${t("best")} ${P.done[x.id].best}/${n}</p>
   ${fresh.length?`<div class="newbadges">${fresh.map(b=>`<span class="pill">${t("newB")} : ${bt(b)[0]}</span>`).join("")}</div>`:""}
   ${x.src?`<p class="meta">Sources : ${x.src.map(esc).join(" · ")}</p>`:""}<div class="cta-row" style="justify-content:center;margin:0"><button class="btn" id="again">${t("again")}</button><a class="btn ghost" href="#${kind}">${t("more")}</a></div></div></div>`;
  $("#again").onclick=()=>openItem(kind,x.id);
}

/* ---------- Routage ---------- */
function updPts(){$("#pts").textContent=P.pts;$("#hav").innerHTML=avatar(P.av)}
function route(){
  const h=(location.hash||"#accueil").slice(1), m=h.match(/^(quiz|cours)-(.+)$/);
  const base=m?m[1]:(V[h]?h:"accueil");
  document.querySelectorAll("[data-r]").forEach(a=>{if(a.dataset.r===base)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  if(m) openItem(m[1],m[2]); else { S=null; app.innerHTML=V[base](); after(base); }
  scrollTo(0,0);
}
function after(v){
  if(v==="annuaire"){const draw=q=>{const n=NAMES.filter(x=>!q||(x[0]+" "+x[2]).toLowerCase().includes(q.toLowerCase()));$("#names").innerHTML=n.length?n.map(x=>`<article class="name"><span class="tag-ex">${t("ex")}</span><h3>${x[0]}</h3><span class="meta">${x[1]}</span><p>${x[2]}</p></article>`).join(""):`<p class="lede">${t("none")}</p>`};draw("");$("#nq").oninput=e=>draw(e.target.value)}
  if(v==="classement"){const draw=list=>{if(!list){$("#boardbox").innerHTML=`<p class="lede">${t("offline")}</p>`;return}
    $("#boardbox").innerHTML=list.length?`<ol class="board">${list.map((e,i)=>`<li class="${e.id===P.pid?"me":""}"><span class="rk">${i+1}</span><span class="av">${avatar(e.av)}</span><span class="nm">${esc(e.name||avName(avById(e.av)||AV[0]))}${e.id===P.pid?` · ${t("you")}`:""}</span><span class="pt">${e.pts} pts</span></li>`).join("")}</ol>`:`<p class="lede">${t("boardEmpty")}</p>`;};
    const j=$("#joinb");if(j)j.onclick=()=>openPicker(false);
    loadBoard().then(l=>{if(location.hash==="#classement"){const jb=$("#joinb");if(!ONLINE&&jb)jb.hidden=true;draw(l)}});}
  if(v==="profil"){$("#chav").onclick=()=>openPicker(false);
    const j=$("#joinb");if(j)j.onclick=()=>openPicker(false);
    const cp=$("#cpcode");if(cp)cp.onclick=()=>{navigator.clipboard.writeText(P.code).then(()=>$("#cpnote").textContent=t("copied")).catch(()=>{getSelection().selectAllChildren($("#mycode"));$("#cpnote").textContent=t("copyFail")})};
    const rb=$("#rbtn");if(rb)rb.onclick=async()=>{const c=$("#rcode").value;$("#rnote").textContent=t("wait");try{const r=await api("/sync",{code:c});takeServer(r);route()}catch(e){$("#rnote").textContent=e.status===404||e.status===400?t("badCode"):t("netErr")}};
    const db=$("#delb");if(db)db.onclick=()=>{$("#delrow").innerHTML=`<span>${t("delQ")}</span><button class="btn" id="dely">${t("yes")}</button><button class="btn ghost" id="deln">${t("no")}</button>`;
      $("#deln").onclick=route;$("#dely").onclick=async()=>{try{await api("/delete",{code:P.code});delete P.code;delete P.pid;save();route()}catch(e){$("#cpnote").textContent=t("netErr")}}};$("#rz1").onclick=()=>{$("#rz").innerHTML=`<span>${t("resetQ")}</span><button class="btn" id="rzy">${t("yes")}</button><button class="btn ghost" id="rzn">${t("no")}</button>`;
    $("#rzy").onclick=()=>{P={pts:0,done:{},perfect:0,badges:[],av:P.av,name:P.name};save();updPts();route()};$("#rzn").onclick=route}}
}
function applyLang(){document.documentElement.lang=L;$("#lang").value=L;document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));if(S&&S.stage!=="end")drawPlayer();else if(!S)route()}
$("#lang").onchange=e=>{L=e.target.value;try{localStorage.setItem("sk-lang",L)}catch(_){}applyLang()};
addEventListener("hashchange",route);
updPts(); applyLang();
let asked=false;try{asked=!!localStorage.getItem(KEY+"-asked")}catch(e){}
loadBoard().finally(()=>{if(!P.av&&!asked)openPicker(true);else if(location.hash==="#profil")route();});
</script>
